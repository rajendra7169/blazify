<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a room on Blazify</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #fff;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; text-align: center;
    background: #141414; border-radius: 20px; padding: 32px 24px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p  { margin: 0 0 22px; color: rgba(255,255,255,.7); font-size: 14px; }
  .code {
    font: 600 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 3px; padding: 16px; border-radius: 14px;
    background: rgba(255,167,38,.12); color: #FFA726; margin-bottom: 24px;
  }
  a.btn {
    display: block; padding: 15px; border-radius: 28px;
    text-decoration: none; font-weight: 600; margin-bottom: 10px;
  }
  .primary { background: linear-gradient(90deg,#FFA726,#FF7043); color: #1A0E00; }
  .ghost   { border: 1px solid rgba(255,255,255,.22); color: #fff; font-weight: 500; }
  .note { font-size: 12.5px; color: rgba(255,255,255,.45); margin: 16px 0 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Join the room</h1>
    <p id="sub">Someone is listening on Blazify and wants you along.</p>
    <div class="code" id="code">......</div>
    <a class="btn primary" id="open" href="#">Open in Blazify</a>
    <a class="btn ghost" href="https://github.com/rajendra7169/blazify/releases/latest/download/Blazify.apk">Get Blazify</a>
    <p class="note">Already have the app? The button above opens it straight at this room.</p>
  </div>
<script>
  var code = new URLSearchParams(location.search).get('code')
          || new URLSearchParams(location.search).get('room') || '';
  code = code.trim();
  var deepLink = 'blazify://listen?code=' + encodeURIComponent(code);

  if (code) {
    document.getElementById('code').textContent = code;
    document.getElementById('open').href = deepLink;
    // Give the app a chance to take over before anyone has to tap anything.
    setTimeout(function () { location.href = deepLink; }, 400);
  } else {
    document.getElementById('code').textContent = 'no code';
    document.getElementById('sub').textContent = 'This invite link is missing its room code.';
    document.getElementById('open').style.display = 'none';
  }
</script>
</body>
</html>
